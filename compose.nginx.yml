# Nginx reverse-proxy overlay for my-linux-server deployment.
# Deploy with:
#   docker compose -f compose.yml -f compose.nginx.yml --env-file .env up -d --build
#
# Requires the external docker network "nginx-network" to exist on the host:
#   docker network create nginx-network
#
# Domains routed by nginx (DOMAIN=beoni.nqtn.dev):
#   beoni.nqtn.dev          →  frontend  :80
#   api.beoni.nqtn.dev      →  backend   :8000
#   adminer.beoni.nqtn.dev  →  adminer   :8080

services:
  adminer:
    container_name: beoni-adminer
    hostname: beoni-adminer
    networks:
      - nginx-network
      - default

  prestart:
    networks:
      - default

  backend:
    container_name: beoni-backend
    hostname: beoni-backend
    networks:
      - nginx-network
      - default

  frontend:
    container_name: beoni-frontend
    hostname: beoni-frontend
    networks:
      - nginx-network
      - default

networks:
  # Replace the external Traefik network with a local internal one.
  traefik-public:
    external: false
    name: beoni-traefik-internal
  nginx-network:
    external: true
    name: nginx-network
